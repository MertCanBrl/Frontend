<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">MÜDEK</span>
      <span class="brand-sub">Öğretim Üyesi</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/instructor/course-contents" routerLinkActive="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Ders İçerikleri
      </a>
      <a class="nav-item" routerLink="/instructor/term-courses" routerLinkActive="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Dönemdeki Dersler
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">{{ fullName?.charAt(0) }}</div>
        <div class="user-meta">
          <div class="user-name">{{ fullName }}</div>
          <div class="user-role">Öğretim Üyesi</div>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Çıkış
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
